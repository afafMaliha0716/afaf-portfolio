name: Sync NeetCode progress

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync-neetcode.mjs
      - .github/workflows/neetcode.yml

permissions:
  contents: write

concurrency:
  group: neetcode-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/sync-neetcode.test.mjs
      - name: Fetch the solutions repo with its full history
        run: git clone --quiet https://github.com/afafMaliha0716/neetcode-submissions "$RUNNER_TEMP/neetcode"
      - run: node scripts/sync-neetcode.mjs "$RUNNER_TEMP/neetcode"
      - name: Commit if the progress changed
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/neetcode.json
            git commit -m "Update NeetCode progress"
            git push
          fi
